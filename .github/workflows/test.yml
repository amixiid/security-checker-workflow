name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.1/actionlint_1.7.1_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: |
          set -euo pipefail
          # test.yml and release.yml use `uses: ./`, so actionlint also
          # validates the local action.yml metadata.
          actionlint .github/workflows/test.yml
          actionlint .github/workflows/release.yml

      - name: Install shellcheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz"
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck"
          echo "$RUNNER_TEMP/shellcheck/shellcheck-v0.10.0" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: shellcheck -x scripts/*.sh scripts/checks/*.sh

      - name: Validate shell scripts syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/checks/*.sh; do bash -n "$f"; done

      - name: Validate Node sources
        run: |
          set -euo pipefail
          for f in src/*.js; do node --check "$f"; done

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare fixture workspace
        shell: bash
        run: |
          set -euo pipefail
          cp -r .github/tests/fixture/. .
          git init
          git add -A
          git -c user.email=test@test.local -c user.name=test commit -m init

      - name: Run AragSoft Security (clean fixture)
        id: aragsoft
        uses: ./
        with:
          enable-codeql: 'false'
          enable-semgrep: 'false'
          enable-docker: 'false'
          enable-sbom: 'false'
          enable-repo: 'false'
          enable-pr-comment: 'false'
          upload-artifacts: 'true'
          debug: 'false'

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "score=${{ steps.aragsoft.outputs.score }}"
          echo "status=${{ steps.aragsoft.outputs.status }}"
          test -n "${{ steps.aragsoft.outputs.score }}"
          test -f "$RUNNER_TEMP/aragsoft-security/report.md"
          test -f "$RUNNER_TEMP/aragsoft-security/report.html"
          test -f "$RUNNER_TEMP/aragsoft-security/report.json"
          test -f "$RUNNER_TEMP/aragsoft-security/security.sarif"
          test -f "$RUNNER_TEMP/aragsoft-security/summary.md"

  fail-gate:
    name: Failure gate (secrets must fail)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare fixture workspace (contains a secret)
        shell: bash
        run: |
          set -euo pipefail
          cp -r .github/tests/fixture/. .
          git init
          git add -A
          git -c user.email=test@test.local -c user.name=test commit -m init
          printf 'FIXTURE-SECRET-ABCDEFGHIJKLMNOPQRSTUVWX\n' > leaked.txt
          git add leaked.txt
          git -c user.email=test@test.local -c user.name=test commit -m "add leaked secret"

      - name: Run AragSoft Security (must fail)
        id: aragsoft
        continue-on-error: true
        uses: ./
        with:
          enable-codeql: 'false'
          enable-semgrep: 'false'
          enable-docker: 'false'
          enable-sbom: 'false'
          enable-pr-comment: 'false'
          enable-repo: 'false'
          fail-on-secrets: 'true'

      - name: Assert failure gate
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.aragsoft.outputs.status }}"
          secrets="${{ steps.aragsoft.outputs.secrets }}"
          echo "status=$status secrets=$secrets"
          test "$status" = "fail"
          test "$secrets" = "fail"

  full-scan:
    name: Full scan (all checks, Ubuntu)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare fixture workspace
        shell: bash
        run: |
          set -euo pipefail
          cp -r .github/tests/fixture/. .
          git init
          git add -A
          git -c user.email=test@test.local -c user.name=test commit -m init

      - name: Run AragSoft Security (all checks)
        id: aragsoft
        uses: ./
        with:
          enable-codeql: 'true'
          enable-pr-comment: 'false'
          enable-repo: 'false'

      - name: Verify outputs and score
        shell: bash
        run: |
          set -euo pipefail
          echo "score=${{ steps.aragsoft.outputs.score }} status=${{ steps.aragsoft.outputs.status }}"
          echo "codeql=${{ steps.aragsoft.outputs.codeql }}"
          test -n "${{ steps.aragsoft.outputs.score }}"
          test -f "$RUNNER_TEMP/aragsoft-security/report.json"
          test -f "$RUNNER_TEMP/aragsoft-security/security.sarif"
          test -f "$RUNNER_TEMP/aragsoft-security/sbom/sbom.cyclonedx.json" || test -f "$RUNNER_TEMP/aragsoft-security/sbom/sbom.spdx.json"
