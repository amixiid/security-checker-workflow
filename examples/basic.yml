# Basic usage - scan every push and pull request with default settings.
name: Security

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: amixiid/security-checker-workflow@v1
