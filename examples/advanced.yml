# Advanced usage - every option configured explicitly.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: amixiid/security-checker-workflow@v1
        with:
          # Failure gates
          fail-on-secrets: 'true'
          fail-on-high: 'true'
          fail-on-critical: 'true'
          fail-on-license: 'true'
          fail-on-tool-error: 'true'

          # Checks
          enable-secrets: 'true'
          enable-dependencies: 'true'
          enable-semgrep: 'true'
          enable-codeql: 'true'
          enable-docker: 'true'
          enable-license: 'true'
          enable-sbom: 'true'
          enable-repo: 'true'

          # Tuning
          semgrep-rules: 'p/security-audit'
          semgrep-severity-threshold: 'warning'
          codeql-languages: 'javascript-typescript,python'
          docker-image: 'myorg/app:latest'
          docker-build: 'false'
          sbom-format: 'both'
          trivy-ignore-unfixed: 'true'

          # Tool versions (pin for reproducibility)
          gitleaks-version: '8.30.1'
          osv-scanner-version: '2.4.0'
          trivy-version: '0.72.0'
          syft-version: '1.50.0'
          semgrep-version: 'latest'

          # Reporting
          upload-artifacts: 'true'
          enable-pr-comment: 'true'
          report-title: 'Security Report'
          debug: 'false'
